<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currículo Profissional | Maximiliano Ferreira</title>

  <script src="https://cdn.jsdelivr.net/npm/markdown-it/dist/markdown-it.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f5f3ef;
      --surface: #ffffff;
      --surface-2: #faf8f5;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #0f766e;
      --primary-hover: #0b5e57;
      --border: #e5e7eb;
      --code-bg: #f3f4f6;
      --shadow: 0 10px 30px rgba(0,0,0,0.06);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 32px 16px 48px;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", Arial, sans-serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin: 0 auto 16px;
      max-width: 960px;
    }

    .btn-exportar {
      border: 0;
      background: var(--primary);
      color: #fff;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(15, 118, 110, 0.22);
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-exportar:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(15, 118, 110, 0.24);
    }

    .btn-exportar:active {
      transform: translateY(0);
    }

    .markdown-body {
      background: var(--surface);
      padding: 48px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .markdown-body > *:first-child {
      margin-top: 0;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4 {
      color: var(--text);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .markdown-body h1 {
      font-size: 2.35rem;
      margin: 0 0 1.25rem;
      padding-bottom: 0.85rem;
      border-bottom: 2px solid var(--border);
    }

    .markdown-body h2 {
      font-size: 1.45rem;
      margin: 2.2rem 0 1rem;
      color: var(--primary);
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
    }

    .markdown-body h3 {
      font-size: 1.1rem;
      margin: 1.6rem 0 0.65rem;
      font-weight: 800;
    }

    .markdown-body p {
      margin: 0 0 1rem;
      color: var(--text);
    }

    .markdown-body ul,
    .markdown-body ol {
      margin: 0 0 1.25rem 1.25rem;
      padding: 0;
    }

    .markdown-body li {
      margin-bottom: 0.45rem;
    }

    .markdown-body strong {
      font-weight: 700;
      color: #111827;
    }

    .markdown-body a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .markdown-body a:hover {
      text-decoration: underline;
    }

    .markdown-body hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    .markdown-body blockquote {
      margin: 1.5rem 0;
      padding: 0.9rem 1rem;
      border-left: 4px solid var(--primary);
      background: var(--surface-2);
      color: var(--muted);
      border-radius: 0 10px 10px 0;
    }

    .markdown-body code {
      background: var(--code-bg);
      padding: 0.15rem 0.4rem;
      border-radius: 6px;
      font-size: 0.92em;
    }

    .markdown-body pre {
      background: #111827;
      color: #f9fafb;
      padding: 1rem;
      border-radius: 12px;
      overflow-x: auto;
      margin: 1.5rem 0;
    }

    .markdown-body pre code {
      background: transparent;
      padding: 0;
      color: inherit;
    }

    .erro {
      color: #b91c1c;
      font-weight: 700;
    }

    @media (max-width: 768px) {
      body {
        padding: 20px 12px 32px;
      }

      .topbar {
        margin-bottom: 12px;
      }

      .btn-exportar {
        width: 100%;
      }

      .markdown-body {
        padding: 24px;
        border-radius: 14px;
      }

      .markdown-body h1 {
        font-size: 1.9rem;
      }

      .markdown-body h2 {
        font-size: 1.25rem;
      }

      .markdown-body h3 {
        font-size: 1rem;
      }

      .markdown-body li,
      .markdown-body p {
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .markdown-body a {
        font-size: 0.92rem;
        line-height: 1.5;
      }
    }

    @media print {
      @page {
        size: A4;
        margin: 14mm;
      }

      body {
        background: #fff;
        padding: 0;
      }

      .topbar {
        display: none !important;
      }

      .markdown-body {
        box-shadow: none;
        border: none;
        border-radius: 0;
        padding: 0;
        max-width: 100%;
      }

      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3 {
        page-break-after: avoid;
      }

      .markdown-body ul,
      .markdown-body p,
      .markdown-body li {
        page-break-inside: avoid;
      }

      .markdown-body a {
        color: inherit;
        text-decoration: none;
      }
    }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PDLTH6B4"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
  <main class="container">
    <div class="topbar">
      <button id="exportPdfBtn" class="btn-exportar" type="button">Exportar PDF</button>
    </div>

    <article id="conteudo" class="markdown-body">Carregando currículo...</article>
  </main>

  <script>
    const md = window.markdownit({
      html: true,
      linkify: true,
      typographer: true
    });

    fetch('./curriculo.md')
      .then(response => {
        if (!response.ok) {
          throw new Error('Não foi possível carregar o arquivo curriculo.md');
        }
        return response.text();
      })
      .then(markdown => {
        document.getElementById('conteudo').innerHTML = md.render(markdown);
      })
      .catch(error => {
        document.getElementById('conteudo').innerHTML =
          '<p class="erro">Erro ao carregar o currículo.</p><p>' + error.message + '</p>';
      });

    document.getElementById('exportPdfBtn').addEventListener('click', function () {
      window.print();
    });
  </script>
</body>
</html>
